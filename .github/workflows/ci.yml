name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/fanoutfuse
        env:
          CGO_ENABLED: '0'
      - name: Verify runaway replay trips
        shell: bash
        env:
          HOME: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ./fanoutfuse replay fixtures/69332.yaml | tee "$RUNNER_TEMP/replay.txt"
          grep -Eq '^TRIP rule=spawn_(burst|rate) ' "$RUNNER_TEMP/replay.txt"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          args: --config=.golangci.yml
